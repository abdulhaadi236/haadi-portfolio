# Netlify detects Next.js automatically; this file only adds caching for large static media.
# Browsers reuse their copy for an hour, then quietly re-check in the background — fast repeat
# visits, and replaced files (same name) show up within about an hour.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"
