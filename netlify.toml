# Netlify detects Next.js automatically; this file only adds caching for large static media.
# Video and images rarely change — browsers keep them for a week, then re-check.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
